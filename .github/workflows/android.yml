name: Android CI

on:
  push:
    branches:
      - '**'       # Run on all branches
  pull_request:
    branches:
      - '**'       # Run for PRs targeting any branch

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7-jdk17
    steps:
      - uses: actions/checkout@v4
      - name: Build with Gradle
        run: gradle build